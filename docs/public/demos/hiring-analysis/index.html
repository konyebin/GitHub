<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hiring themes and trends</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--muted:#5d6b7c;--line:#dde2e8;--accent:#0b5cad;--robust:#1f7a4d;--suggestive:#b7791f;--weak:#8a94a3;--warn:#fff4e0}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14213d;color:#fff;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}.mode{font-size:12px;padding:3px 10px;border-radius:12px;background:#ffd166;color:#14213d;font-weight:600}
.mode.share{background:#8fd9a8}
nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.banner{background:var(--warn);border:1px solid #f1d49b;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}.card .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}
.finding{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.finding:first-child{border-top:0}
.badge{flex:none;height:20px;font-size:11px;font-weight:700;color:#fff;border-radius:10px;padding:0 9px;line-height:20px;text-transform:uppercase}
.badge.robust{background:var(--robust)}.badge.suggestive{background:var(--suggestive)}.badge.weak{background:var(--weak)}
.finding .ev{color:var(--muted);font-size:12px;margin-top:2px}
.tag{font-size:11px;color:var(--muted);margin-left:6px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:#f0f3f7;position:sticky;top:0}.tbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
details>summary{cursor:pointer;color:var(--accent);margin:6px 0}
ul.cav{margin:6px 0 0 18px;padding:0;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
svg text{font:11px system-ui,sans-serif;fill:#3b4757}
.small{font-size:12px;color:var(--muted)}
.intro{margin:2px 0 10px;color:#2b3645}
.tour{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:8px}
.tour a{display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:inherit;text-decoration:none;background:#fafbfd}
.tour a:hover{border-color:var(--accent)}.tour b{display:block;color:var(--accent)}
abbr.g{text-decoration:underline dotted #7a8aa0;cursor:help}
.hint{font-size:12px;color:var(--muted);background:#f3f6fa;border-radius:6px;padding:6px 10px;margin:8px 0 0}
.gl dt{font-weight:700;margin-top:10px}.gl dd{margin:2px 0 0 0;color:#2b3645}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.terms span{background:#eef3f9;border-radius:12px;padding:2px 10px;font-size:12px}
.pipe{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.pipe div{flex:1;min-width:150px;background:#f3f6fa;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
.pipe b{display:block;font-size:13px;margin-bottom:2px}
</style>
</head>

ent layouts may leak a few such tokens.", "Rank strength labels: robust needs BH q<0.05, a bootstrap CI excluding 0, a second method (Kendall or HC3 rank regression) at p<0.05 and sign stability >=90% under 80% subsampling.", "Effect-size words (negligible/small/moderate/large) are descriptive bands on |rho| (0.1/0.3/0.5), not decision cutoffs.", "Interview ranks include any assessor leniency; reviewer effects are analysed in the interviewers module and are not removed here."], "findings": [{"text": "18 of 150 candidates have no resume and are excluded from all resume-topic analyses; they are reported separately below.", "strength": "robust", "evidence": "n=150, no resume=18, resumes analysed=132"}, {"text": "Whether a candidate has a resume on file is associated with reaching TI only to the degree shown; missing resumes are not imputed.", "strength": "weak", "evidence": "n=150, rho=+0.08 [-0.10, +0.26], perm p=0.3463"}, {"text": "Bottom-up resume themes: 5 topics chosen from the data (coherence 1.00, matched-topic stability 1.00 across seeds/80% subsamples). Topics: T1: supporting end, tools, tools quickly, users; T2: python projects, solutions, seeking solutions, solutions role; T3: study certification, sales engineering, self study, manager moving; T4: recent graduate, strong customer, summer, summer internship; T5: years customer, work, systems engineer, deployment.", "strength": "robust", "evidence": "n=132 resumes, 109 terms, k searched 2-8"}, {"text": "No resume theme is clearly associated with any process outcome; the largest is 'T3: study certification, sales engineering, self study, manager moving' vs Decision (No Hire<Standby<Hire).", "strength": "weak", "evidence": "n=59, rho=-0.24 [-0.48, +0.04], perm p=0.0660, BH q=0.651"}, {"text": "Hypothesis 'interviews favour a certain resume type': after controlling for Role Play and Presentation ranks, the resume theme 'T5: years customer, work, systems engineer, deployment' shows a negligible partial association with the Interview percentile rank (positive) - what this process rewarded in interviews, range-restricted to AC attendees.", "strength": "weak", "evidence": "n=59, rho=+0.08 [-0.15, +0.36], perm p=0.5211, BH q=0.950"}, {"text": "All resume themes together add 0.007 to R-squared of Interview rank beyond Role Play + Presentation ranks (no detectable gain).", "strength": "weak", "evidence": "n=59, delta R2=0.007, Freedman-Lane perm p=0.9620, 4 topic columns"}, {"text": "With employer/school/city lines held out, no resume theme is clearly tied to home city, skills tag or graduation date.", "strength": "weak", "evidence": "n=132, 15 topic x proxy tests, smallest BH q=0.613"}, {"text": "For contrast, topics fitted on the full resume text (proxy lines kept) reach city epsilon-squared up to 0.42, versus 0.10 after holding proxy lines out; this shows how much a topic model would otherwise lean on location.", "strength": "suggestive", "evidence": "n=132, k=4, smallest perm p=0.0001"}, {"text": "Proxy-line content (schools, employers, cities) shows no clear association with process outcomes.", "strength": "weak", "evidence": "n=59, rho=-0.28 [-0.51, -0.01], perm p=0.0291, BH q=0.864"}], "charts": [{"id": "resume-coverage", "type": "table", "title": "Candidates with and without a resume", "x_label": "", "y_label": "", "data": {"columns": ["group", "n", "share reached TI", "share attended AC (of group)", "share hired (of group)", "suppressed"], "rows": [["Has resume", 132, 0.818, 0.447, 0.212, false], ["No resume", 18, 0.722, 0.444, 0.167, false]]}}, {"id": "resume-k-selection", "type": "bar", "title": "Topic count selection", "x_label": "candidate number of topics", "y_label": "score", "data": {"labels": ["k=2", "k=3", "k=4", "k=5", "k=6", "k=7", "k=8"], "series": [{"name": "coherence (NPMI)", "values": [0.884, 0.89, 0.941, 1.0, 0.878, 0.763, 0.709]}, {"name": "stability (matched cosine)", "values": [0.953, 0.971, 0.967, 0.998, 0.888, 0.863, 0.852]}]}, "subtitle": "Chosen k m ation p=0.000 (adj 0.002), bootstrap CI [0.150, 0.587]"}, {"text": "For Role Play, reviewer identity does not explain more rank variance than chance after adjusting for independent signals.", "strength": "weak", "evidence": "n=67, 5 reviewers, adjusted ICC=0.000 (unadjusted 0.000, mixed model 0.008), permutation p=1.000 (adj 1.000), bootstrap CI [0.000, 0.203]"}, {"text": "For Presentation, reviewer identity does not explain more rank variance than chance after adjusting for independent signals.", "strength": "weak", "evidence": "n=67, 5 reviewers, adjusted ICC=0.000 (unadjusted 0.000, mixed model 0.016), permutation p=1.000 (adj 1.000), bootstrap CI [0.000, 0.178]"}, {"text": "For Technical interview, reviewer identity does not explain more rank variance than chance after adjusting for independent signals.", "strength": "weak", "evidence": "n=67, 3 reviewers, adjusted ICC=0.000 (unadjusted 0.000, mixed model 0.002), permutation p=1.000 (adj 1.000), bootstrap CI [0.000, 0.151]"}, {"text": "Assessor 4 gave Interview scores that are higher than other signals predict for the same candidates (possible leniency; for review, not a verdict).", "strength": "robust", "evidence": "n=9, shrunken deviation=+25.9 percentile-rank points (raw +31.5), 95% CI [+9.5, +37.3], permutation p adj=0.009, rank-sum p adj=0.001"}, {"text": "Assessor 1 gave Interview scores that are lower than other signals predict for the same candidates (possible severity; for review, not a verdict).", "strength": "suggestive", "evidence": "n=20, shrunken deviation=-11.7 percentile-rank points (raw -12.8), 95% CI [-20.1, -4.4], permutation p adj=0.067, rank-sum p adj=0.048"}, {"text": "No reviewer shows a trend in scoring across candidate-number order beyond chance (candidate number is a rough time proxy).", "strength": "weak", "evidence": "n=268 ratings in 18 units tested (>=8 each), smallest adjusted p=0.453"}, {"text": "Across reviewers, the written tone of notes tracks the scores given (notes alone recover the rank order).", "strength": "robust", "evidence": "n=322 notes, cross-validated Spearman rho=0.86 [0.83, 0.88], Kendall tau=0.65, same-tercile agreement=0.82"}, {"text": "Assessor 5 uses more subjective-style (score-unrelated) language than other reviewers.", "strength": "robust", "evidence": "n=36 notes, share 0.123 vs 0.038 others, rank-sum adjusted p=0.000 (lexicon B 0.000)"}, {"text": "Recruiter 3 uses less subjective-style (score-unrelated) language than other reviewers.", "strength": "weak", "evidence": "n=34 notes, share 0.010 vs 0.052 others, rank-sum adjusted p=0.074 (lexicon B 0.074)"}, {"text": "Assessor 5's subjective-style language share (given the score rank) differs by resume group (highest in Resume group 4, lowest in Resume group 1); this is a flag for review, not evidence of intent.", "strength": "weak", "evidence": "n=24 candidates, 4 groups, variance share between groups=0.46, permutation p=0.008 (adjusted 0.136), Kruskal adjusted p=0.397"}, {"text": "Interview and Role Play ranks agree across different assessors strongly.", "strength": "robust", "evidence": "n=51 candidates, Spearman rho=0.67 [0.48, 0.81], Kendall tau=0.54, p=1e-07"}, {"text": "Interview and Presentation ranks agree across different assessors strongly.", "strength": "robust", "evidence": "n=49 candidates, Spearman rho=0.51 [0.28, 0.72], Kendall tau=0.39, p=0.000157"}, {"text": "Role Play and Presentation ranks agree across different assessors strongly.", "strength": "robust", "evidence": "n=53 candidates, Spearman rho=0.56 [0.33, 0.71], Kendall tau=0.43, p=1.52e-05"}, {"text": "Technical-interview scores agree with later assessment-center rank among candidates who advanced (range-restricted).", "strength": "suggestive", "evidence": "n=67, Spearman rho=0.29 [0.08, 0.47], Kendall tau=0.21, p=0.0176"}], "charts": [{"id": "rank-boxplot", "type": "boxplot", "title": "Percentile rank of scores given, by reviewer and exercise", "subtitle": "Percentile rank within the exercise ac  {c:'Stages and components',k:'TI',re:/\bTI\b/,d:'Technical interview. The screening-stage call a recruiter holds before the assessment center. It produces a score (the sheet\'s passing score is 21, but this analysis never uses it as a cutoff) plus Pass/Fail, notes and an invitation decision.'},

 {c:'Stages and components',k:'Total score (AC)',re:/\bAC total\b/,d:'Sum of the three exercise totals, out of 48. Turned into a within-group percentile rank for analysis.'},

 {c:'Stages and components',k:'Recruiter / Assessor',re:/\b(?:Recruiter|Assessor) \d\b/,d:'Redacted reviewer labels. Recruiters run the TI. Assessors score the three exercises. One reviewer scores each candidate per exercise.'},
 {c:'Stages and components',k:'Proxy-risk fields',re:/\bproxy[- ](?:risk )?(?:fields?|check|line)s?\b/i,d:'Fields that can stand in for protected traits, such as graduation date, home city, school and skills tags. They are checked for bias, never used as selection signals.'},
 {c:'Reading the numbers',k:'Percentile rank',re:/\bpercentile(?: rank)?s?\b/i,d:'A candidate\'s position within their group, from 0 (lowest) to 100 (highest). Using ranks means no hand-picked pass mark decides who counts as good.'},

 {c:'Reading the numbers',k:'Robust / suggestive / weak',re:/\b(?:robust|suggestive)\b/,d:'Strength of a finding. Robust: held across more than one method and resampling. Suggestive: one method or wide uncertainty. Weak: could easily be noise, usually a small sample.'},
 {c:'Statistics',k:'rho (Spearman)',re:/\brho\b|\bSpearman\b/,d:'Rank correlation between two measures, from -1 to +1. 0 means no relationship, +1 means the same ordering. Ignores the size of score gaps, so it avoids cutoffs.'},
 {c:'Statistics',k:'tau (Kendall)',re:/\btau\b|\bKendall\b/,d:'Another rank correlation. It is the share of candidate pairs ordered the same way minus the share ordered oppositely.'},
 {c:'Statistics',k:'CI',re:/\bCI\b|\bconfidence interval\b/i,d:'Confidence interval. The range that likely contains the true value. A CI that includes 0 means the effect could be zero.'},
 {c:'Statistics',k:'Bootstrap',re:/\bbootstrap(?:ped)?\b/i,d:'Re-sampling the candidates many times to see how much an estimate moves. Used to build CIs.'},
 {c:'Statistics',k:'perm. p (permutation test)',re:/\bperm(?:utation)?\.? ?p\b|\bpermutation\b|\bperm\./i,d:'Shuffles the labels many times to see how often chance alone gives a result this large. Smaller p means less likely to be chance.'},
 {c:'Statistics',k:'BH q',re:/\bBH q\b|\bBH\b/,d:'Benjamini-Hochberg adjusted p-value. Corrects for checking many things at once so some do not look significant by luck. q below 0.05 is the usual bar.'},
 {c:'Statistics',k:'AUC',re:/\bAUC\b/,d:'Area under the curve. The chance that a randomly chosen advancing candidate has a higher score rank than a non-advancing one. 0.5 is a coin flip, 1.0 is perfect separation.'},

 {c:'Statistics',k:'CV (cross-validated)',re:/\bCV\b|\bcross-validated\b/i,d:'Tested on candidates the model had not seen, to avoid overstating accuracy.'},

function chartDesc(c){ if(CHART_DESC[c.id]) return CHART_DESC[c.id]; if(/^signal-scatter-/.test(c.id)) return 'Each dot is a candidate. Their other scores against the rank this exercise reviewer gave.'; return ''; }
function legend(names){ return el('div',{class:'legend'}, names.map((n,i)=>el('span',{},el('i',{style:'background:'+COLORS[i%COLORS.length]}),n))); }
function wrap(c, body){
  const d = el('div',{class:'card'}, el('h2',{},rich(c.title)), chartDesc(c)?el('p',{class:'intro'},chartDesc(c)):'', c.subtitle?el('div',{class:'sub'},rich(c.subtitle)):'' , body, el('div',{class:'hint'},HINT[c.type]));
  return d;
}
function barChart(c, horizontal){
  const {labels, series} = c.data, W=720, ml = horizontal? 190 : 50, mb = horizontal? 30 : 70, mt=10, mr=20;
  const rowH = horizontal ? Math.max(18, 12+series.length*10) : 0, H = horizontal ? mt+mb+labels.length*rowH : 300;
  const vals = series.flatMap(s=>s.values.filter(num)); let lo=Math.min(0,...vals), hi=Math.max(0,...vals); if(!vals.length){lo=0;hi=1}
  const [a,b,ticks]=nice(lo,hi); const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  const pw=W-ml-mr, ph=H-mt-mb;
  if(horizontal){
    const x=v=>ml+(v-a)/(b-a)*pw; ticks.forEach(t=>{svg.append(sv('line',{x1:x(t),x2:x(t),y1:mt,y2:H-mb,stroke:'#e6eaef'}),sv('text',{x:x(t),y:H-mb+14,'text-anchor':'middle'},fmt(t)))});
    svg.append(sv('line',{x1:x(0),x2:x(0),y1:mt,y2:H-mb,stroke:'#9aa5b4'}));
    labels.forEach((l,i)=>{ const y0=mt+i*rowH, bh=(rowH-6)/series.length; svg.append(sv('text',{x:ml-6,y:y0+rowH/2+3,'text-anchor':'end'},String(l).slice(0,34)));
      series.forEach((s,j)=>{ const v=s.values[i]; if(!num(v)) { svg.append(sv('text',{x:x(0)+4,y:y0+3+bh*(j+.7),fill:'#999'},'suppressed')); return; }
        const lo2=s.lower&&s.lower[i], hi2=s.upper&&s.upper[i];
        svg.append(sv('rect',{x:Math.min(x(0),x(v)),y:y0+3+bh*j,width:Math.abs(x(v)-x(0)),height:bh-1,fill:COLORS[j%COLORS.length]},sv('title',{},`${l}: ${fmt(v)}`)));
        if(num(lo2)&&num(hi2)) svg.append(sv('line',{x1:x(lo2),x2:x(hi2),y1:y0+3+bh*(j+.5),y2:y0+3+bh*(j+.5),stroke:'#222'}));
      });});
  } else {
    const y=v=>mt+ph-(v-a)/(b-a)*ph, gw=pw/labels.length;
    ticks.forEach(t=>{svg.append(sv('line',{x1:ml,x2:W-mr,y1:y(t),y2:y(t),stroke:'#e6eaef'}),sv('text',{x:ml-6,y:y(t)+3,'text-anchor':'end'},fmt(t)))});
    labels.forEach((l,i)=>{ const bw=(gw*.8)/series.length; series.forEach((s,j)=>{ const v=s.values[i]; const x0=ml+i*gw+gw*.1+bw*j;
      if(num(v)) svg.append(sv('rect',{x:x0,y:Math.min(y(0),y(v)),width:bw-1,height:Math.abs(y(v)-y(0)),fill:COLORS[j%COLORS.length]},sv('title',{},`${l}: ${fmt(v)}`)));
      }); const t=sv('text',{x:ml+i*gw+gw/2,y:H-mb+14,'text-anchor':'end',transform:`rotate(-30 ${ml+i*gw+gw/2} ${H-mb+14})`},String(l).slice(0,26)); svg.append(t); });
  }
  const body=[svg]; if(series.length>1) body.unshift(legend(series.map(s=>s.name)));
  if(c.y_label||c.x_label) body.push(el('div',{class:'small'},[c.x_label,c.y_label].filter(Boolean).join(' / ')));
  return wrap(c, body);
}
function lineChart(c){
  const {labels,series}=c.data, W=720,H=300,ml=50,mr=20,mt=10,mb=40; const vals=series.flatMap(s=>s.values.filter(num)); const [a,b,ticks]=nice(Math.min(...vals,0>Math.min(...vals)?Math.min(...vals):Math.min(...vals)),Math.max(...vals));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'}); const x=i=>ml+(labels.length>1?i/(labels.length-1):.5)*(W-ml-mr), y=v=>mt+(H-mt-mb)-(v-a)/(b-a)*(H-mt-mb);
  ticks.forEach(t=>svg.append(sv('line',{x1:ml,x2:W-mr,y1:y(t),y2:y(t),stroke:'#e6eaef'}),sv('text',{x:ml-6,y:y(t)+3,'text-anchor':'end'},fmt(t))));
  labels.forEach((l,i)=>{ if(labels.length<=14||i%Math.ceil(labels.length/14)===0) svg.append(sv('text',{x:x(i),y:H-mb+14,'text-anchor':'middle'},String(l).slice(0,10)))});
  series.forEach((s,j)=>{ const pts=s.values.map((v,i)=>num(v)?`${x(i)},${y(v)}`:null).filter(Boolean); svg.append(sv('polyline',{points:pts.join(' '),fill:'none',stroke:COLORS[j%COLORS.length],'stroke-width':2}));});
  return wrap(c,[series.length>1?legend(series.map(s=>s.name)):'',svg,el('div',{class:'small'},[c.x_label,c.y_label].filter(Boolean).join(' / '))]);

function scatterChart(c){
  const pts=c.data.points.filter(p=>num(p.x)&&num(p.y)); const W=720,H=360,ml=50,mr=20,mt=10,mb=40;
  const [ax,bx,tx]=nice(Math.min(...pts.map(p=>p.x)),Math.max(...pts.map(p=>p.x))), [ay,by,ty]=nice(Math.min(...pts.map(p=>p.y)),Math.max(...pts.map(p=>p.y)));
  const x=v=>ml+(v-ax)/(bx-ax)*(W-ml-mr), y=v=>H-mb-(v-ay)/(by-ay)*(H-mt-mb); const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  tx.forEach(t=>svg.append(sv('line',{x1:x(t),x2:x(t),y1:mt,y2:H-mb,stroke:'#eef1f5'}),sv('text',{x:x(t),y:H-mb+14,'text-anchor':'middle'},fmt(t))));
  ty.forEach(t=>svg.append(sv('line',{x1:ml,x2:W-mr,y1:y(t),y2:y(t),stroke:'#eef1f5'}),sv('text',{x:ml-6,y:y(t)+3,'text-anchor':'end'},fmt(t))));
  const groups=[...new Set(pts.map(p=>p.group||''))];
  pts.forEach(p=>svg.append(sv('circle',{cx:x(p.x),cy:y(p.y),r:3.5,fill:COLORS[groups.indexOf(p.group||'')%COLORS.length],'fill-opacity':.65},sv('title',{},`${p.label?p.label+': ':''}${fmt(p.x)}, ${fmt(p.y)}${p.group?' ('+p.group+')':''}`))));
  svg.append(sv('text',{x:W/2,y:H-4,'text-anchor':'middle'},c.x_label||''),sv('text',{x:12,y:H/2,'text-anchor':'middle',transform:`rotate(-90 12 ${H/2})`},c.y_label||''));
  return wrap(c,[groups.length>1?legend(groups):'',svg]);
}
function heatmap(c){
  const {row_labels:R,col_labels:C,values:V}=c.data, cs=Math.max(22,Math.min(44,Math.floor(640/C.length))), ml=190,mt=120, W=ml+C.length*cs+20, H=mt+R.length*cs+10;
  const lo=c.data.min??-1, hi=c.data.max??1, mid=(lo+hi)/2, svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  const col=v=>{ if(!num(v)) return '#eee'; const t=(v-mid)/((hi-lo)/2); const a=Math.min(1,Math.abs(t)); return t>=0?`rgba(11,92,173,${.08+a*.85})`:`rgba(214,40,57,${.08+a*.85})`; };
  C.forEach((l,j)=>svg.append(sv('text',{x:ml+j*cs+cs/2,y:mt-6,'text-anchor':'start',transform:`rotate(-60 ${ml+j*cs+cs/2} ${mt-6})`},String(l).slice(0,30))));
  R.forEach((l,i)=>{ svg.append(sv('text',{x:ml-6,y:mt+i*cs+cs/2+3,'text-anchor':'end'},String(l).slice(0,32)));
    C.forEach((_,j)=>{ const v=V[i][j]; svg.append(sv('rect',{x:ml+j*cs,y:mt+i*cs,width:cs-1,height:cs-1,fill:col(v)},sv('title',{},`${l} / ${C[j]}: ${fmt(v)}`)));
      if(num(v)&&cs>=28) svg.append(sv('text',{x:ml+j*cs+cs/2,y:mt+i*cs+cs/2+3,'text-anchor':'middle',style:'font-size:9px'},(Math.round(v*100)/100).toString())); }); });
  return wrap(c,[svg]);

function boxplot(c){
  const gs=c.data.groups, W=720, rowH=26, ml=190, mt=10, mb=30, H=mt+mb+gs.length*rowH; const all=gs.flatMap(g=>[g.min,g.max]).filter(num);
  const [a,b,ticks]=nice(Math.min(...all),Math.max(...all)); const x=v=>ml+(v-a)/(b-a)*(W-ml-20); const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
