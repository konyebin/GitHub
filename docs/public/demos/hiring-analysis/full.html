<head>

<title>Hiring themes and trends</title>
<style>

*{box-sizing:border-box}

a{color:var(--accent)}button{font:inherit;color:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb);will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.o1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--a1)}
.o2{width:36vw;height:36vw;right:-8vw;top:8vh;background:var(--a2);animation-duration:30s;animation-delay:-6s}
.o3{width:44vw;height:44vw;left:25vw;bottom:-24vw;background:var(--a3);animation-duration:26s;animation-delay:-11s}
.o4{width:24vw;height:24vw;right:18vw;bottom:10vh;background:var(--a1);opacity:.3;animation-duration:20s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.94)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:30vh;opacity:.9}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.waves .w1{animation:wave 18s linear infinite}.waves .w2{animation:wave 28s linear infinite reverse;opacity:.7}
@keyframes wave{to{transform:translateX(-50%)}}
body[data-theme=light] .waves path{fill:#049fd9}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 28px;backdrop-filter:blur(22px) saturate(1.5);background:linear-gradient(var(--card),transparent)}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}

.brand i{width:1px;height:26px;background:var(--line)}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.pill{position:relative;display:flex;padding:6px;border-radius:999px;background:var(--chip);border:1px solid var(--cb);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.pill button{position:relative;z-index:2;background:none;border:0;padding:8px 18px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .3s}
.pill button[aria-selected=true],.pill button[aria-selected=true]:hover{color:var(--dropink)}
.pill button:hover{color:var(--ink)}
button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.goo{position:absolute;inset:6px;z-index:1;filter:url(#goo);pointer-events:none}
.drop{position:absolute;background:var(--drop);border-radius:999px;opacity:0;transition:left .38s var(--spring),top .38s var(--spring),width .38s var(--spring),height .38s var(--spring),opacity .3s}
.drop.trail{transition-duration:.7s;transition-timing-function:var(--ease)}
.on .drop{opacity:1}
.spacer{flex:1}
.mode{font-size:12px;padding:3px 12px;border-radius:999px;background:rgba(251,171,24,.9);color:#3a2800;font-weight:700;white-space:nowrap}
.mode.share{background:rgba(110,190,74,.92);color:#10300a}
.chipnote{font-size:12px;color:var(--muted);white-space:nowrap}
.gear{border:1px solid var(--cb);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.gear:hover{background:var(--chip2)}
.layout{position:relative;z-index:5;display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;max-width:1320px;margin:0 auto;padding:10px 28px 90px}
.rail{min-width:0;position:sticky;top:84px;align-self:start}
.rail h4{margin:6px 14px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vpill{flex-direction:column;border-radius:22px;padding:8px}
.vpill button{text-align:left;padding:12px 16px;border-radius:16px;display:flex;align-items:center;gap:12px}

.ico{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:11px;font-weight:800;background:var(--chip2);border:1px solid var(--line)}
.vpill button[aria-selected=true] .ico{background:rgba(255,255,255,.3);border-color:transparent}
main{min-width:0;view-transition-name:view;min-height:70vh}
.banner{background:var(--warn);border:1px solid var(--warnb);border-radius:16px;padding:10px 16px;margin-bottom:18px;font-size:13px}

.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),rgba(4,159,217,.12),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover::before{opacity:1}
.card h2{margin:0 0 4px;font-size:17px;letter-spacing:-.015em}.card .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:18px;margin-bottom:18px}
.grid .card{margin-bottom:0}
.finding{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.finding:first-child{border-top:0}
.badge{flex:none;white-space:nowrap;min-width:116px;text-align:center;height:22px;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:0 11px;line-height:22px;margin-top:1px}
.badge.robust{background:var(--robust)}.badge.suggestive{background:var(--suggestive)}.badge.weak{background:var(--weak)}
.finding .plain{font-size:15px;line-height:1.5}.finding details.tech{margin-top:4px}
.finding details.tech summary,.techname summary{font-size:12px;color:var(--muted)}
.finding .ev{color:var(--muted);font-size:12px;margin-top:2px}
.ask .q{font-weight:700;margin-bottom:6px}.ask .ans{font-size:15px;line-height:1.5}
.badge-ai{display:inline-block;background:#0d274d;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 11px;margin-bottom:4px}
body[data-theme=dark] .badge-ai{background:#049fd9;color:#04202f}.badge-ai.plain,body[data-theme=dark] .badge-ai.plain{background:var(--weak);color:#fff}
.srcs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.srcs>b{font-size:12px;color:var(--muted)}
textarea{width:100%;font:inherit;padding:12px 16px;border:1px solid var(--cb);border-radius:18px;background:var(--chip);color:var(--ink);resize:vertical}
.askbar{margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--cb);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:12.5px;transition:transform .4s var(--spring)}
.chip:hover{transform:translateY(-2px) scale(1.03);background:var(--chip2)}
button.primary{background:var(--drop);color:var(--dropink);border:0;border-radius:999px;padding:9px 26px;font-weight:700}button.primary:disabled{opacity:.6}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--chip2);position:sticky;top:0;backdrop-filter:blur(8px)}.tbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:14px}
details>summary{cursor:pointer;color:var(--accent);margin:6px 0}
ul.cav{margin:6px 0 0 18px;padding:0;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
svg text{font:11px system-ui,sans-serif;fill:var(--ink2)}
.small{font-size:12px;color:var(--muted)}.intro{margin:2px 0 10px;color:var(--ink2)}
.tour{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:8px}
.tour a{display:block;border:1px solid var(--cb);border-radius:18px;padding:12px 16px;color:inherit;text-decoration:none;background:var(--chip);transition:transform .5s var(--spring)}
.tour a:hover{transform:translateY(-4px) scale(1.015);border-color:var(--a1)}.tour b{display:block;color:var(--accent)}
abbr.g{text-decoration:underline dotted var(--muted);cursor:help}
.hint{font-size:12px;color:var(--muted);background:var(--chip2);border-radius:12px;padding:7px 12px;margin:8px 0 0}
.gl dt{font-weight:700;margin-top:10px}.gl dd{margin:2px 0 0 0;color:var(--ink2)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.terms span{background:var(--chip2);border-radius:999px;padding:2px 10px;font-size:12px}
.pipe{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.pipe div{flex:1;min-width:150px;background:var(--chip);border:1px solid var(--cb);border-radius:16px;padding:10px 12px;font-size:12px}.pipe b{display:block;font-size:13px;margin-bottom:2px}
.lab{position:fixed;z-index:60;right:18px;top:70px;width:min(310px,calc(100vw - 36px));padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--cb);backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--shadow)}
.lab[hidden]{display:none}.lab h5{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--cb);background:var(--chip);border-radius:14px;padding:8px 8px;font-size:13px;font-weight:600;transition:transform .35s var(--spring)}
.seg button[aria-pressed=true]{background:var(--drop);color:var(--dropink);border-color:transparent}.seg button:hover{transform:translateY(-2px)}
.lab p{margin:0;font-size:12px;color:var(--muted)}
::view-transition-group(root){animation-duration:.8s}
html[data-vt=glide]::view-transition-old(root),html[data-vt=glide]::view-transition-new(root),html[data-vt=rise]::view-transition-old(root),html[data-vt=rise]::view-transition-new(root){animation:none;mix-blend-mode:normal}
html[data-vt=glide]::view-transition-old(view){animation:vout .32s var(--ease) both}
html[data-vt=glide]::view-transition-new(view){animation:vin .62s var(--ease) both}
@keyframes vout{to{opacity:0;transform:translateX(-36px) scale(.985);filter:blur(8px)}}
@keyframes vin{from{opacity:0;transform:translateX(44px) scale(.985);filter:blur(10px)}}
html[data-vt=liquid]::view-transition-old(root){animation:none;mix-blend-mode:normal}

@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,50%))}}
html[data-vt=rise]::view-transition-old(view),html[data-vt=rise]::view-transition-new(view){animation:none}
.rise>*{animation:rise .8s var(--ease) both;animation-delay:calc(var(--k,0)*80ms)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97);filter:blur(6px)}}
.fb-in{animation:vin .6s var(--ease) both}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);padding:6px 14px 80px}.rail{position:static}.vpill{flex-direction:row;overflow-x:auto;border-radius:999px}.vpill button{white-space:nowrap}.rail h4{display:none}.top{flex-wrap:wrap;padding:10px 14px;gap:10px}.spacer,.chipnote{display:none}.pill{overflow-x:auto;max-width:100%}.grid{grid-template-columns:minmax(0,1fr)}.brand h1{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.bg,.top,.rail,.lab{display:none}.layout{display:block}.card{backdrop-filter:none;box-shadow:none}}

<script id="payload" type="application/json">{"mode": "local", "built": "2026-11-02 15:31", "sections": {"funnel": {"section": "funnel", "title": "Hiring funnel", "caveats": ["Outcomes (reached TI, invited, attended, decision) are past human decisions, not measures of job performance; findings describe what the process rewarded.", "Later-stage scores exist only for candidates who passed earlier gates and are never imputed. Comparisons at the assessment-center stage are range-restricted to people who reached it.", "Percentile ranks are within-cohort mid-ranks (0-100): the TI rank is computed among everyone with a TI score and the AC rank among assessment-center attendees, so the two scales are not directly comparable levels.", "Proxy-risk fields (graduation year, home city, skills tag, resume on file) are checked as possible sources of bias, not as legitimate selection features. With small cells these tests have low power; a null result is not proof of no bias.", "Groups with fewer than 5 candidates are suppressed in the shareable copy; candidate ids appear only in the local copy."], "findings": [{"text": "The process narrows most at 'TI -> invited' (conversion 55%); that is also the largest absolute loss (54 candidates). Overall 150 candidates in screening, 121 reached TI, 67 were invited, 67 attended the assessment center, and 31 received Hire, 17 Standby, 19 No Hire.", "strength": "robust", "evidence": "n=150; conversion at narrowest gate 67/121 (Wilson 95% CI 46%-64%); exact counts", "plain": "The process narrows most at the step from the technical interview to an invitation: only 67 of 121 candidates moved on. That is also where the most people were lost. Of 150 people in screening, 31 received a Hire decision."}, {"text": "On score rank, 'AC -> Hire' is the most score-driven gate (AUC 0.94, CI 0.88-0.99) and 'TI -> invited' the least (AUC 0.92, CI 0.86-0.97). Gates are compared on the score each stage had in hand (TI rank for the TI and invitation gates, assessment-center rank for the decision gates); the assessment-center gates are range-restricted. The difference between these two gates is within sampling noise, so they cannot be ranked with confidence.", "strength": "weak", "evidence": "n=67 vs 121; AUC difference 0.03 (bootstrap CI -0.06 to 0.10); top gate perm. p=0.0005, BH q=0.0008", "plain": "Both the final hire step and the invitation step follow the scores closely: the person who moved on had the higher score in about 9 in 10 comparisons. We cannot say which step leans on scores more; the gap between them is small enough to be chance."}, {"text": "Invited candidates had higher TI percentile ranks than non-invited ones (median 71 vs 25), but the distributions overlap: a random non-invited candidate outranked a random invited one in 8% of pairs.", "strength": "robust", "evidence": "n=67 invited vs 54 not; AUC 0.92 (bootstrap CI 0.86-0.97); perm. p=0.0005, Mann-Whitney p=2.6e-15", "plain": "Invited candidates usually ranked higher on the technical interview than those who were not (typical ranking 71 vs 25 out of 100), but not always: someone not invited outscored an invited candidate in about 1 in 10 comparisons."}, {"text": "Everyone who was invited attended the assessment center in this data, so that gate shows no attrition and cannot be compared on score rank.", "strength": "robust", "evidence": "n=67 invited, 67 attended", "plain": "Everyone who was invited (67 people) came to the assessment center, so no one dropped out at that step and there is nothing to compare there."}, {"text": "Screening Pass/Fail follows TI score closely (AUC 1.00); 0 of 3504 Pass/Fail pairs have the Fail candidate scoring at or above the Pass candidate (lowest Pass score 21 vs highest Fail score 20). The two groups do not overlap, so the sheet behaves like a fixed TI score line even though the analysis imposes none.", "strength": "robust", "evidence": "n=73 Pass, 48 Fail; AUC CI 1.00-1.00; perm. p=0.0005", "plain": "The screening Pass/Fail result matches the technical-interview score exactly: all 73 people marked Pass scored above everyone marked Fail (lowest Pass 21, highest Fail 20). It works like a fixed score line."}, {"text": "15 candidate(s) have a screening record that disagrees with the TI score or with another screening field (10 where Pass/Fail and the invitation disagree, 5 where the invitation is unlikely under a model on TI rank, 5 whose Status says instructions were sent although no TI score exists and they never attended). Candidate ids are in the local copy only.", "strength": "suggestive", "evidence": "n=121 with a TI score; model-fence threshold on -log P = 1.83 (95th percentile of model-simulated outcomes)", "plain": "15 candidates have a screening record that does not fit the technical-interview score or other screening fields; for 10 of them the Pass/Fail result and the invitation point opposite ways. Worth a look, not a verdict. Names are in the local copy only."}, {"text": "Bias check: none of 20 tests of the proxy-risk fields (graduation year, home city, skills tag, resume on file) against reaching TI, invitation, hire or score rank survives multiple-testing correction. Small cells mean low power, so this does not rule out bias.", "strength": "weak", "evidence": "n=67-150 per test; smallest BH q=1.00 across 20 tests; permutation p-values with 2000 permutations", "plain": "We ran 20 checks for links between background details (graduation year, home city, skills tag, resume on file) and who advanced or scored well, and none stood out beyond chance. With groups this small the checks are not sensitive, so this does not rule out bias."}], "charts": [{"id": "funnel-stages", "type": "bar", "title": "Candidates at each stage", "data": {"labels": ["In screening", "Reached TI", "Invited / advanced", "Attended assessment center"], "series": [{"name": "Candidates", "values": [150, 121, 67, 67]}], "suppressed": [false, false, false, false]}, "y_label": "Candidates"}, {"id": "funnel-decisions", "type": "bar", "title": "Final decision groups (assessment-center attendees)", "data": {"labels": ["Decision: Hire", "Decision: Standby", "Decision: No Hire"], "series": [{"name": "Candidates", "values": [31, 17, 19]}], "suppressed": [false, false, false]}, "y_label": "Candidates"}, {"id": "gate-table", "type": "table", "title": "Stage-to-stage conversion and how strongly each gate follows score rank", "data": {"columns": ["Gate", "n at risk", "n through", "Conversion %", "Conv. CI low", "Conv. CI high", "Score-rank AUC", "AUC CI low", "AUC CI high", "Perm. p", "BH q", "Strength", "Score used", "suppressed"], "rows": [["Screening -> reached TI", 150, 121, 80.7, 73.6, 86.2, null, null, null, null, null, null, "no score for non-reachers", false], ["TI -> invited", 121, 67, 55.4, 46.5, 63.9, 0.918, 0.861, 0.967, 0.0005, 0.0008, "robust", "TI percentile", false], ["Invited -> attended AC", 67, 67, 100.0, 94.6, 100.0, null, null, null, null, null, null, "TI percentile", false], ["AC -> Hire", 67, 31, 46.3, 34.9, 58.1, 0.944, 0.878, 0.991, 0.0005, 0.0008, "robust", "AC total percentile", false], ["AC -> Hire or Standby", 67, 48, 71.6, 59.9, 81.0, 0.925, 0.857, 0.974, 0.0005, 0.0008, "robust", "AC total percentile", false], ["AC -> Hire (TI rank, range-restricted)", 67, 31, 46.3, null, null, 0.669, 0.542, 0.798, 0.016, 0.02, "robust", "TI percentile (earlier stage)", false], ["AC -> Hire or Standby (TI rank, range-restricted)", 67, 48, 71.6, null, null, 0.577, 0.43, 0.715, 0.3328, 0.3328, "weak", "TI percentile (earlier stage)", false]]}, "subtitle": "AUC 0.5 = score rank unrelated to passing the gate; 1.0 = everyone who passed outranks everyone who did not. No score cutoff is assumed."}, {"id": "gate-selection", "type": "hbar", "title": "Score-rank selectivity of each gate (AUC)", "data": {"labels": ["TI -> invited", "AC -> Hire", "AC -> Hire or Standby", "AC -> Hire (TI rank, range-restricted)", "AC -> Hire or Standby (TI rank, range-restricted)"], "series": [{" "Graduation year: AC total rank", "Home city: Invited after TI", "Graduation year: Hired", "Has resume: AC total rank", "Has resume: TI score rank", "Graduation year: Reached TI", "Skills tag: AC total rank", "Home city: AC total rank", "Graduation year: TI score rank", "Graduation year: Invited after TI"], "series": [{"name": "Effect size", "values": [0.161, 0.121, 0.144, 0.091, 0.097, 0.007, 0.003, 0.066, 0.058, 0.144, 0.037, 0.033]}]}, "subtitle": "Twelve strongest of the tests; see table for p-values and corrections.", "x_label": "Effect size (not comparable across statistics)"}, {"id": "proxy-rates", "type": "table", "title": "Invitation rate and TI rank by proxy-field group", "data": {"columns": ["Proxy field", "Group", "n (reached TI)", "n invited", "Invited %", "CI low", "CI high", "Median TI percentile", "suppressed"], "rows": [["Graduation year", "2024", 31, 17, 54.8, 37.8, 70.8, 63.6, false], ["Graduation year", "2025", 38, 19, 50.0, 34.8, 65.2, 44.6, false], ["Graduation year", "2026", 29, 19, 65.5, 47.3, 80.1, 54.1, false], ["Graduation year", "2027", 23, 12, 52.2, 33.0, 70.8, 44.6, false], ["Home city", "Atlanta, GA", 13, 6, 46.2, 23.2, 70.9, 36.8, false], ["Home city", "Austin, TX", 13, 11, 84.6, 57.8, 95.7, 63.6, false], ["Home city", "Bogota, CO", 6, 5, 83.3, 43.6, 97.0, 90.5, false], ["Home city", "Boston, MA", 16, 7, 43.8, 23.1, 66.8, 58.9, false], ["Home city", "Chicago, IL", 9, 5, 55.6, 26.7, 81.1, 54.1, false], ["Home city", "Denver, CO", 14, 8, 57.1, 32.6, 78.6, 44.6, false], ["Home city", "Mexico City, MX", 12, 6, 50.0, 25.4, 74.6, 40.7, false], ["Home city", "Phoenix, AZ", 8, 3, 37.5, 13.7, 69.4, 33.9, false], ["Home city", "Raleigh, NC", 9, 7, 77.8, 45.3, 93.7, 54.1, false], ["Home city", "Sao Paulo, BR", 7, 3, 42.9, 15.8, 75.0, 36.8, false], ["Home city", "Seattle, WA", 9, 4, 44.4, 18.9, 73.3, 54.1, false], ["Home city", "Toronto, ON", 5, 2, 40.0, 11.8, 76.9, 19.8, false], ["Skills tag", "(none listed)", 18, 8, 44.4, 24.6, 66.3, 49.4, false], ["Skills tag", "Bachelor Computer Science", 27, 16, 59.3, 40.7, 75.5, 54.1, false], ["Skills tag", "Experience: help desk", 12, 8, 66.7, 39.1, 86.2, 44.6, false], ["Skills tag", "Former Intern", 23, 10, 43.5, 25.6, 63.2, 44.6, false], ["Skills tag", "Holds CCNA", 26, 15, 57.7, 38.9, 74.5, 58.9, false], ["Skills tag", "Studying for AWS", 15, 10, 66.7, 41.7, 84.8, 54.1, false], ["Has resume", "has resume", 108, 59, 54.6, 45.2, 63.7, 54.1, false], ["Has resume", "no resume", 13, 8, 61.5, 35.5, 82.3, 44.6, false]]}, "subtitle": "Compare invitation rate with median TI percentile: a group with a lower rate but similar rank is worth reviewing."}]}, "structure": {"section": "structure", "title": "Score structure and decision alignment", "caveats": ["Assessment-center scores exist only for the candidates who passed the screening gates, so every correlation involving them is range-restricted (TI scores among attendees have 66% of the spread seen among all TI takers) and understates what a full applicant pool would show. Nothing is imputed.", "Scores are 1-4 per competency, so ties are heavy; Spearman correlations and mid-rank percentiles handle ties but have limited resolution. Percentile ranks are within-instrument and within-cohort.", "With a few dozen candidates, correlations and clusters are imprecise: read the bootstrap intervals, not the point values.", "The final decision was made by people who saw the exercise scores, so decision-versus-score agreement is partly circular; it shows how consistently the process followed the scores, not whether scores or decisions are right.", "Outcomes are past human decisions, not job performance. Clusters are derived from the data and described afterwards; they are not predefined categories. About 5% of candidates would be flagged by the model fence even if the process were perfectly consistent with the model.", "Groups with fewer than 5 candidates are suppressed in the shareable copy; candidate ids appear only in the local copy."], "findings": [{"text": "Interview and Role Play ranks agree with each other (rho 0.65) more than either agrees with Presentation (Interview-Presentation 0.44, Role Play-Presentation 0.50), which hints that Presentation reflects partly separate signal, but with this sample the gap is not statistically reliable.", "strength": "weak", "evidence": "n=67; Int-RP minus mean of the two Presentation pairs = 0.17 (bootstrap CI -0.02 to 0.38); rho difference 0.20 (CI 0.01 to 0.41) and 0.15 (CI -0.08 to 0.37); Williams p=0.0376 / 0.145; exchange-permutation p=0.0715 / 0.2384", "plain": "Interview and Role Play rankings line up more closely with each other (0.65) than either does with Presentation (0.44 to 0.50), where 1 would mean identical rankings. Presentation may measure something different, but with so few candidates the gap is not reliable and could be chance."}, {"text": "Technical-interview score is only weakly to moderately related to the exercise ranks among those who reached the assessment center (strongest with Presentation, rho 0.33); this is range-restricted because only people who passed screening have exercise scores.", "strength": "robust", "evidence": "n=67; rho(TI, Int/RP/Pres) = 0.21/0.15/0.33; CI for Presentation 0.09 to 0.54; TI spread among attendees = 66% of spread among all TI takers", "plain": "Technical-interview scores loosely track how people ranked in the exercises (closest link: Presentation, 0.33, where 1 would mean identical rankings). Only people who passed screening have exercise scores, so the link across all applicants could be stronger."}, {"text": "Shared competencies agree across exercises more than unrelated competencies do (mean rho 0.33 vs 0.28). Executive Presence & Communication, scored in all three exercises, has cross-exercise rho between 0.24 and 0.44. Agreement within a single exercise is higher still (0.41), which points to an exercise or assessor effect on top of the competency itself.", "strength": "weak", "evidence": "n=67 candidates, 4 shared pairs; shared minus unrelated = 0.05 (bootstrap CI -0.05 to 0.15); within-exercise minus shared = 0.08 (CI -0.05 to 0.20); all shared-pair Spearman p<0.049", "plain": "The same competency scored in different exercises agrees a little more (0.33) than unrelated competencies do (0.28), where 1 would mean identical rankings. Competencies scored within one exercise agree most (0.41), so the exercise or assessor seems to shape scores as well. This is not reliable and could be chance."}, {"text": "The 12 competency scores are not 12 independent signals: 1 component(s) rise above chance (first component 38% of variance, bootstrap CI 31%-46%). After rotation, 67% of competencies load on a component dominated by their own exercise, which is more than expected if exercise did not matter.", "strength": "robust", "evidence": "n=67; exercise purity 0.67 (bootstrap CI 0.50-0.67) vs label-shuffle mean 0.47, permutation p=0.0065; parallel analysis retains 1", "plain": "The 12 competency scores overlap heavily instead of measuring 12 separate skills: one general pattern explains about 4 in 10 of the differences between candidates. 8 of 12 competencies group more with other scores from the same exercise than with the same competency elsewhere, which is more than chance would give."}, {"text": "Presentation is the exercise whose rank diverges most from the other two (mean absolute gap 21.2 percentile points vs 17.6 for the others). Presentation rank vs mean of Interview and Role Play rank has rho 0.51; the most divergent candidates are listed in the local copy.", "strength": "weak", "evidence": "n=67; gap difference 3.6 points (bootstrap CI -1.0 to 8.5); Presentation vs mean(Int, RP) rho=0.51, p=8.9e-06", "plain": "Presentation stands out most: a candidate's ranking on it typically differs by about 21 points (on a 0-100 scale) from their ranking on the other two exercises, versus about 18 for the others. The most different cases are listed in the local copy. This is not reliable and could be chance."}, {"text": "Rank profiles split into 2 data-derived clusters (silhouette 0.35 vs 0.27 for shuffled profiles). Cluster 1 (n=31): average rank 69; relatively strongest on Role Play, weakest on TI; Cluster 2 (n=36): average rank 33; relatively strongest on TI, weakest on Role Play.", "strength": "robust", "evidence": "n=67; silhouette 0.35, bootstrap stability ARI 0.89 (5th pct 0.57), chance silhouette 95th pct 0.27; smallest cluster n=31", "plain": "Candidates fall into 2 fairly distinct groups by their overall ranking, from a top group averaging about 69 out of 100 to a bottom group averaging about 33. The groups were found in the data, not set in advance."}, {"text": "Decisions follow assessment-center score rank (Kendall tau 0.68) but the groups overlap: a random Hire candidate outranked a random Standby candidate in 89% of pairs; a random Standby candidate outranked a random No Hire candidate in 80% of pairs; a random Hire candidate outranked a random No Hire candidate in 99% of pairs. No score cutoff is assumed; overlap is read from the full percentile distributions.", "strength": "robust", "evidence": "n=67 (No Hire 19, Standby 17, Hire 31); tau 0.68 (bootstrap CI 0.60 to 0.75, p=4.1e-12); ordinal logit: each +10 percentile points multiplies the odds of a higher decision by 2.68 (95% CI 1.89-3.80, p=3.3e-08)", "plain": "Final decisions follow assessment-center scores closely, but not perfectly. Comparing two candidates with neighboring decisions, the one with the better decision had the higher score in about 8 in 10 comparisons."}, {"text": "3 candidate(s) have a decision far out of line with their within-cohort score rank (flagged by an ordinal-logit residual fence); in total 110 of 1404 comparable candidate pairs are in the opposite order on decision and score. Candidate ids are in the local copy only.", "strength": "suggestive", "evidence": "n=67; fence on -log P(observed) = 1.97; discordant pair share 7.8%; flags are single outliers, so strength is limited to suggestive", "plain": "3 candidates have a final decision that looks out of step with their score ranking. Also, in 110 of 1404 comparisons between candidates with different decisions, the higher scorer got the worse decision. Worth a look, not a verdict. Names are in the local copy only."}], "charts": [{"id": "instrument-ranks", "type": "table", "title": "Instruments converted to within-instrument percentile ranks", "data": {"columns": ["Instrument", "n scored", "Min", "Median", "Max", "Distinct values", "% at most common value", "SD of percentile rank", "suppressed"], "rows": [["TI score", 121, 8.0, 22.0, 32.0, 25, 9.9, 28.9, false], ["Interview total", 67, 7.0, 11.0, 16.0, 10, 19.4, 28.8, false], ["Role Play total", 67, 5.0, 11.0, 15.0, 10, 17.9, 28.8, false], ["Presentation total", 67, 4.0, 12.0, 16.0, 12, 17.9, 28.9, false], ["Business Acumen & Technical Insights [Int]", 67, 1.0, 3.0, 4.0, 4, 37.3, 27.5, false], ["Collaboration & Teamwork [Int]", 67, 1.0, 3.0, 4.0, 4, 44.8, 27.3, false], ["Executive Presence & Communication [Int]", 67, 1.0, 3.0, 4.0, 4, 43.3, 27.4, false], ["Growth Mindset, Resilience & Learning Agility [Int]", 67, 1.0, 3.0, 4.0, 4, 46.3, 27.2, false], ["Builds Trust / Trusted Advisor [RP]", 67, 1.0, 3.0, 4.0, 4, 43.3, 26.8, false], ["Coachability [RP]", 67, 1.0, 3.0, 4.0, 4, 53.7, 26.4, false], ["Executive Presence & Communication [RP]", 67, 1.0, 3.0, 4.0, 4, 50.7, 26.5, false], ["Explains Concepts Simply [RP]", 67, 1.0, 2.0, 4.0, 4, 43.3, 27.3, false], ["AI Fluency & Orchestration [Pres]", 67, 1.0, 3.0, 4.0, 4, 49.3, 26.9, false], ["Coachability [Pres]", 67, 1.0, 3.0, 4.0, 4, 37.3, 27.6, false], ["Executive Presence & Communication [Pres]", 67, 1.0, 3.0, 4.0, 4, 34.3, 27.7, false], ["Goes Deep (Technical Acumen) [Pres]", 67, 1.0, 3.0, 4.0, 4, 38.8, 27.6, false]]}, "subtitle": "Each instrument is ranked only among the candidates who took it. A high share at one value means many ties and coarser ranks."} "label": null, "group": "Hire"}, {"x": 28.4, "y": -0.06, "label": null, "group": "No Hire"}, {"x": 20.9, "y": -0.02, "label": null, "group": "No Hire"}, {"x": 88.8, "y": 2.15, "label": null, "group": "Hire"}, {"x": 79.9, "y": 1.99, "label": null, "group": "Hire"}, {"x": 17.9, "y": 0.92, "label": null, "group": "Standby"}, {"x": 15.7, "y": 0.88, "label": null, "group": "Standby"}, {"x": 6.0, "y": 0.12, "label": null, "group": "No Hire"}, {"x": 34.3, "y": 0.88, "label": null, "group": "Standby"}, {"x": 17.9, "y": -0.04, "label": null, "group": "No Hire"}, {"x": 85.8, "y": 2.11, "label": null, "group": "Hire"}]}, "subtitle": "Vertical axis: 0 = No Hire, 1 = Standby, 2 = Hire (jittered). Labels mark flagged candidates in the local copy.", "x_label": "AC total percentile rank (0-100)", "y_label": "Decision level (jittered)"}]}, "resume_themes": {"section": "resume_themes", "title": "Resume themes and what the process rewarded", "caveats": ["Outcomes (reached TI, attended the assessment center, ranks, decision) are past human decisions; this describes what the process rewarded, not who would perform well.", "Later-stage ranks exist only for candidates who passed earlier gates, so those comparisons are range-restricted. Nothing is imputed.", "Topics come from short resumes with an unsupervised model; they are descriptive, and the number of topics was chosen from coherence and stability, not a fixed value.", "Employers, schools, cities and dates are held out of the topic vocabulary by line shape (dates, 'Org, Place' lines, known home cities). Resumes with different layouts may leak a few such tokens.", "Rank strength labels: robust needs BH q<0.05, a bootstrap CI excluding 0, a second method (Kendall or HC3 rank regression) at p<0.05 and sign stability >=90% under 80% subsampling.", "Effect-size words (negligible/small/moderate/large) are descriptive bands on |rho| (0.1/0.3/0.5), not decision cutoffs.", "Interview ranks include any assessor leniency; reviewer effects are analysed in the interviewers module and are not removed here."], "findings": [{"text": "18 of 150 candidates have no resume and are excluded from all resume-topic analyses; they are reported separately below.", "plain": "18 of 150 candidates have no resume on file, so they are left out of the resume analysis.", "strength": "robust", "evidence": "n=150, no resume=18, resumes analysed=132"}, {"text": "Whether a candidate has a resume on file is associated with reaching TI only to the degree shown; missing resumes are not imputed.", "plain": "Having a resume on file does not clearly go with reaching the technical interview. Any small difference could be chance.", "strength": "weak", "evidence": "n=150, rho=+0.08 [-0.10, +0.26], perm p=0.3463"}, {"text": "Bottom-up resume themes: 5 topics chosen from the data (coherence 1.00, matched-topic stability 1.00 across seeds/80% subsamples). Topics: T1: supporting end, tools, tools quickly, users; T2: python projects, solutions, seeking solutions, solutions role; T3: study certification, sales engineering, self study, manager moving; T4: recent graduate, strong customer, summer, summer internship; T5: years customer, work, systems engineer, deployment.", "plain": "We found 5 common types of resume, for example ones mentioning 'supporting', 'end' and 'tools', and others mentioning 'python', 'projects' and 'solutions'. The same groups came back each time we re-ran the analysis.", "strength": "robust", "evidence": "n=132 resumes, 109 terms, k searched 2-8"}, {"text": "No resume theme is clearly associated with any process outcome; the largest is 'T3: study certification, sales engineering, self study, manager moving' vs Decision (No Hire<Standby<Hire).", "plain": "We did not find any type of resume that clearly goes with a better or worse outcome. Any small differences could be chance.", "strength": "weak", "evidence": "n=59, rho=-0.24 [-0.48, +0.04], perm p=0.0660, BH q=0.651"}, {"text": "Hypothesis 'interviews favour a certain resume type': after controlling for Role Play and Presentation ranks, the resume theme 'T5: years customer, work, systems engineer, deployment' shows a negligible partial association with the Interview percentile rank (positive) - what this process rewarded in interviews, range-restricted to AC attendees.", "plain": "After accounting for how people did in the role play and presentation, we found no reliable sign that interviews favored a certain type of resume. Any small difference could be chance.", "strength": "weak", "evidence": "n=59, rho=+0.08 [-0.15, +0.36], perm p=0.5211, BH q=0.950"}, {"text": "All resume themes together add 0.007 to R-squared of Interview rank beyond Role Play + Presentation ranks (no detectable gain).", "plain": "Looking at all resume types together adds about 1% to what we can explain about interview ranking beyond role play and presentation results. That is not reliable and could be chance.", "strength": "weak", "evidence": "n=59, delta R2=0.007, Freedman-Lane perm p=0.9620, 4 topic columns"}, {"text": "With employer/school/city lines held out, no resume theme is clearly tied to home city, skills tag or graduation date.", "plain": "After removing school, employer and city lines, we found no type of resume that clearly goes with home city, skills tag or graduation date. Any small differences could be chance.", "strength": "weak", "evidence": "n=132, 15 topic x proxy tests, smallest BH q=0.613"}, {"text": "For contrast, topics fitted on the full resume text (proxy lines kept) reach city epsilon-squared up to 0.42, versus 0.10 after holding proxy lines out; this shows how much a topic model would otherwise lean on location.", "plain": "When we let the analysis see schools, employers and cities, resume groups lined up with home city about 4 times as strongly as after removing them. That is why those lines are held out.", "strength": "suggestive", "evidence": "n=132, k=4, smallest perm p=0.0001"}, {"text": "Proxy-line content (schools, employers [{"text": "389 notes across 5 sources were analysed (counts per source in the length chart).", "plain": "We read 389 reviewer notes from 5 stages of the process.", "strength": "robust", "evidence": "n=389 notes, sources=Technical interview:121, Interview:67, Role Play:67, Presentation:67, Overall:67"}, {"text": "Technical interview notes: theme 'T1: question, layer technology, impact, needed' co-varies with score rank (lower scores, large).", "plain": "In technical interview notes, a common theme built around words like 'question', 'layer' and 'technology' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=121, rho=-0.70 [-0.78, -0.58], perm p=0.0001, BH q=0.000"}, {"text": "Interview notes: theme 'T1: struggled, technology, struggled deeper, prompting quantify' co-varies with score rank (lower scores, large).", "plain": "In interview notes, a common theme built around words like 'struggled', 'technology' and 'deeper' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=67, rho=-0.62 [-0.74, -0.43], perm p=0.0001, BH q=0.000"}, {"text": "Role Play notes: theme 'T1: question, struggled, struggled deeper, technology' co-varies with score rank (lower scores, large).", "plain": "In role-play notes, a common theme built around words like 'question', 'struggled' and 'deeper' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=67, rho=-0.62 [-0.73, -0.45], perm p=0.0001, BH q=0.000"}, {"text": "Presentation notes: theme 'T1: prompting, prompting quantify, quantify impact, question asked' co-varies with score rank (lower scores, large).", "plain": "In presentation notes, a common theme built around words like 'prompting', 'quantify' and 'impact' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=67, rho=-0.77 [-0.83, -0.66], perm p=0.0001, BH q=0.000"}, {"text": "Overall notes: theme 'T1: struggled deeper, technology, layer technology, candidate struggled' co-varies with score rank (lower scores, large).", "plain": "In overall assessment notes, a common theme built around words like 'struggled', 'deeper' and 'technology' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=67, rho=-0.90 [-0.93, -0.83], perm p=0.0001, BH q=0.000"}, {"text": "All sources notes: theme 'T1: answered, different, different question, candidate answered' co-varies with score rank (lower scores, large).", "plain": "Across all notes, a common theme built around words like 'answered', 'different' and 'question' goes with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=389, rho=-0.69 [-0.73, -0.64], perm p=0.0001, BH q=0.000"}, {"text": "Technical interview: wording linked to higher rank: moving, moving forward, recommend moving, recommend, forward; to lower rank: answered different, answered, candidate needed, candidate answered, candidate struggled.", "plain": "In technical interview notes, words like 'moving', 'forward' and 'recommend' go with higher scores and words like 'answered', 'different' and 'needed' go with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=121, 140 terms scanned, top term rho=+0.81 [+0.73, +0.85], BH q=0.0001"}, {"text": "Interview: wording linked to higher rank: recommend, recommend moving, moving forward, moving, forward; to lower rank: answered different, answered, candidate answered, candidate needed, deeper.", "plain": "In interview notes, words like 'recommend', 'moving' and 'forward' go with higher scores and words like 'answered', 'different' and 'needed' go with lower scores. This is a strong, consistent pattern.", "strength": "robust", "evidence": "n=67, 112 terms scanned, top term rho=+0.84 [+0.76, +0.87], BH q=0.0002"}, {"text": "Role Play: wording linked to higher rank: moving, moving forward, recom more than chance would. Any difference between reviewers here is not reliable."}, {"text": "Assessor 4 gave Interview scores that are higher than other signals predict for the same candidates (possible leniency; for review, not a verdict).", "strength": "robust", "evidence": "n=9, shrunken deviation=+25.9 percentile-rank points (raw +31.5), 95% CI [+9.5, +37.3], permutation p adj=0.009, rank-sum p adj=0.001", "plain": "Assessor 4 scored Interview noticeably higher than the same candidates' other results would suggest, by roughly 26 places in a ranking of 100. This is a clear, consistent pattern worth a conversation; it is a flag for review, not a verdict on the person."}, {"text": "Assessor 1 gave Interview scores that are lower than other signals predict for the same candidates (possible severity; for review, not a verdict).", "strength": "suggestive", "evidence": "n=20, shrunken deviation=-11.7 percentile-rank points (raw -12.8), 95% CI [-20.1, -4.4], permutation p adj=0.067, rank-sum p adj=0.048", "plain": "Assessor 1 scored Interview somewhat lower than the same candidates' other results would suggest, by roughly 12 places in a ranking of 100. This is a possible pattern worth a look, but it is not firm; it is a flag for review, not a verdict on the person."}, {"text": "No reviewer shows a trend in scoring across candidate-number order beyond chance (candidate number is a rough time proxy).", "strength": "weak", "evidence": "n=268 ratings in 18 units tested (>=8 each), smallest adjusted p=0.453", "plain": "We found no sign that any reviewer got stricter or more generous as the process went on (268 ratings checked across 18 reviewer-and-exercise groups)."}, {"text": "Across reviewers, the written tone of notes tracks the scores given (notes alone recover the rank order).", "strength": "robust", "evidence": "n=322 notes, cross-validated Spearman rho=0.86 [0.83, 0.88], Kendall tau=0.65, same-tercile agreement=0.82", "plain": "The wording of reviewers' written notes dates who advanced (range-restricted); outcomes are past decisions, not job performance."], ["Inter-rater reliability within one exercise", "No", "No candidate is rated twice in the same exercise."]]}}]}}}</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const SECTIONS = [
 ["overview","Overview","The strongest findings from every section, in one place."],

 ["resume_themes","Resume themes","Groups resumes by common themes, then checks whether any theme goes with who advanced or how they scored. Also a bias check."],
 ["notes_themes","Notes themes","What reviewers wrote. Which words and themes go with higher or lower scores, and does the tone of a note match the score given?"],

 ["ask","Ask the data","Type a question about the data and get an answer drawn from the findings above, with links to the evidence."]];

const G = [
 {c:'Stages and components',k:'TI',re:/\bTI\b/,d:'Technical interview. The screening-stage call a recruiter holds before the assessment center. It produces a score (the sheet\'s passing score is 21, but this analysis never uses it as a cutoff) plus Pass/Fail, notes and an invitation decision.'},
 {c:'Stages and components',k:'AC',re:/\bAC\b/,d:'Assessment center. The second stage, made up of three exercises: Interview, Role Play and Presentation. Only people invited after the TI take part.'},
 {c:'Stages and components',k:'Interview (exercise)',re:/\bInterview\b/,d:'First assessment center exercise. Four competencies scored 1 to 4 (maximum 16): Growth Mindset, Resilience and Learning Agility; Executive Presence and Communication; Collaboration and Teamwork; Business Acumen and Technical Insights.'},
 {c:'Stages and components',k:'Role Play',re:/\bRole Play\b/,d:'Second exercise. Four competencies scored 1 to 4 (maximum 16): Builds Trust / Trusted Advisor; Executive Presence and Communication; Coachability; Explains Concepts Simply.'},
 {c:'Stages and components',k:'Presentation',re:/\bPresentation\b/,d:'Third exercise. Four competencies scored 1 to 4 (maximum 16): AI Fluency and Orchestration; Executive Presence and Communication; Coachability; Goes Deep (Technical Acumen).'},
 {c:'Stages and components',k:'RP / Pres / Int',re:/\b(?:RP|Pres|Int)\b/,d:'Short labels for Role Play, Presentation and Interview in chart labels.'},
 {c:'Stages and components',k:'Total score (AC)',re:/\bAC total\b/,d:'Sum of the three exercise totals, out of 48. Turned into a within-group percentile rank for analysis.'},
 {c:'Stages and components',k:'Decision (Hire / Standby / No Hire)',re:/\b(?:Standby|No Hire)\b/,d:'The final decision recorded after the assessment center. Recorded live by people, so it is a past human decision, not a measure of job performance.'},
 {c:'Stages and components',k:'Recruiter / Assessor',re:/\b(?:Recruiter|Assessor) \d\b/,d:'Redacted reviewer labels. Recruiters run the TI. Assessors score the three exercises. One reviewer scores each candidate per exercise.'},
 {c:'Stages and components',k:'Proxy-risk fields',re:/\bproxy[- ](?:risk )?(?:fields?|check|line)s?\b/i,d:'Fields that can stand in for protected traits, such as graduation date, home city, school and skills tags. They are checked for bias, never used as selection signals.'},
 {c:'Reading the numbers',k:'Percentile rank',re:/\bpercentile(?: rank)?s?\b/i,d:'A candidate\'s position within their group, from 0 (lowest) to 100 (highest). Using ranks means no hand-picked pass mark decides who counts as good.'},
 {c:'Reading the numbers',k:'n',re:/\bn=\d+/,d:'Number of candidates (or notes) behind an estimate. Small n means wide uncertainty.'},
 {c:'Reading the numbers',k:'Range-restricted',re:/\brange-restricted\b/i,d:'Only people who passed earlier stages have later scores, so later comparisons cover a narrower group and can understate real links.'},
 {c:'Reading the numbers',k:'Suppressed',re:/\bsuppressed\b/i,d:'Hidden because fewer than 5 candidates are in the group, to avoid identifying anyone.'},
 {c:'Reading the numbers',k:'Robust / suggestive / weak',re:/\b(?:robust|suggestive)\b/,d:'How much to trust a finding. High confidence (robust): it held up across several checks. Possible pattern (suggestive): worth a look but not proven. Not reliable (weak): could easily be chance.'},
 {c:'Statistics',k:'rho (Spearman)',re:/\brho\b|\bSpearman\b/,d:'A score from -1 to +1 for how closely two lineups match. +1 means the same order, 0 means no link, -1 means opposite order.'},
 {c:'Statistics',k:'tau (Kendall)',re:/\btau\b|\bKendall\b/,d:'Another way to measure how closely two lineups match: how often two candidates are in the same order in both.'},
 {c:'Statistics',k:'CI',re:/\bCI\b|\bconfidence interval\b/i,d:'Margin of error: the range the true value probably falls in. If the range includes zero, the real effect could be nothing.'},

function makeTabs(nav,ids,numbered){ ids.forEach((id,i)=>{ const b=el('button',{role:'tab','data-id':id}); if(numbered) b.append(el('span',{class:'ico'},String(i+1))); b.append(labelOf(id)); b.onclick=e=>go(id,e); nav.append(b); });
  nav.addEventListener('keydown',e=>{ const bs=[...nav.querySelectorAll('button')], i=bs.indexOf(document.activeElement); const vert=nav.getAttribute('aria-orientation')==='vertical'; const nx=e.key===(vert?'ArrowDown':'ArrowRight')?1:e.key===(vert?'ArrowUp':'ArrowLeft')?-1:0; if(nx&&i>-1){ e.preventDefault(); const t=bs[(i+nx+bs.length)%bs.length]; t.focus(); t.click(); } }); }
function place(nav,id){ const goo=nav.querySelector('.goo'), bs=[...nav.querySelectorAll('button')], btn=bs.find(b=>b.dataset.id===id);
  bs.forEach(b=>{ b.setAttribute('aria-selected',String(b===btn)); b.tabIndex=(b===btn||(!btn&&b===bs[0]))?0:-1; });
  nav.classList.toggle('on',!!btn); if(!btn) return;
  if(nav.scrollWidth>nav.clientWidth+2) nav.scrollTo({left:btn.offsetLeft-(nav.clientWidth-btn.offsetWidth)/2,behavior:'instant'});
  const g=goo.getBoundingClientRect(), r=btn.getBoundingClientRect();
  goo.querySelectorAll('.drop').forEach(d=>{ d.style.left=(r.left-g.left)+'px'; d.style.top=(r.top-g.top)+'px'; d.style.width=r.width+'px'; d.style.height=r.height+'px'; }); }
const paint=id=>{ place($('#topnav'),id); place($('#rail'),id); };
const canVT=()=>!!document.startViewTransition&&!reduce&&(prefs.motion==='glide'||prefs.motion==='liquid');
function show(id){ render(id); [...main.children].forEach((c,i)=>c.style.setProperty('--k',Math.min(i,8)));
  main.className=prefs.motion==='rise'&&!reduce?'rise':(prefs.motion!=='off'&&!canVT()&&current!==null?'fb-in':''); scrollTo({top:0,behavior:'instant'}); }
function go(id,e,fromHash){ if(!valid(id)) id='overview'; if(id===current) return; const first=current===null; current=id;
  const pt=e&&e.clientX!=null?{x:e.clientX,y:e.clientY}:last; root.style.setProperty('--vx',pt.x+'px'); root.style.setProperty('--vy',pt.y+'px');
  const swap=()=>{ paint(id); show(id); if(!fromHash) history.pushState(null,'','#'+id); };
  if(first||!canVT()){ swap(); return; }
  root.dataset.vt=prefs.motion; document.startViewTransition(swap); }
function setSeg(box,key){ box.querySelectorAll('button').forEach(b=>{ b.setAttribute('aria-pressed',String(b.dataset.v===prefs[key])); b.onclick=()=>{ prefs[key]=b.dataset.v; savePrefs(); applyPrefs(); setSeg(box,key); }; }); }
function applyPrefs(){ body.dataset.theme=prefs.theme; root.dataset.vt=prefs.motion; root.style.colorScheme=prefs.theme; if(current) requestAnimationFrame(()=>paint(current)); }
makeTabs($('#topnav'),TOP,false); makeTabs($('#rail'),RAIL,true);
$('#gear').onclick=()=>{ const l=$('#lab'); l.hidden=!l.hidden; $('#gear').setAttribute('aria-expanded',String(!l.hidden)); };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#lab').hidden) $('#gear').click(); });
setSeg($('#themes'),'theme'); setSeg($('#motions'),'motion'); applyPrefs();
addEventListener('hashchange',()=>go(location.hash.slice(1)||'overview',null,true));
addEventListener('resize',()=>current&&paint(current));
document.fonts&&document.fonts.ready.then(()=>current&&paint(current));
go(location.hash.slice(1)||'overview',null,true);
</script>
</body>
</html>
